<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV Toolkit Mirror</title>
  <style>
    :root {
      --bg: #0b0f14;
      --text: #e8eef2;
      --muted: #8a99a6;
      --accent: #3fd8cf;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Google Sans", Roboto, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: var(--bg);
      transition: opacity 0.3s;
    }
    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 56px;
      font-weight: 600;
    }
    .brand svg {
      width: 64px;
      height: 64px;
    }
    #status {
      font-size: 32px;
      color: var(--muted);
    }
    .dots {
      display: flex;
      gap: 12px;
    }
    .dots span {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.2s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    #debug {
      position: fixed;
      left: 24px;
      bottom: 24px;
      margin: 0;
      padding: 12px 16px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.7);
      color: var(--accent);
      font: 20px/1.4 ui-monospace, Menlo, monospace;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline></video>
  <div id="overlay">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <rect x="2.5" y="4" width="19" height="13" rx="2"/>
        <path d="M8 20.5h8"/>
      </svg>
      TV Toolkit
    </div>
    <div id="status">Waiting for your phone…</div>
    <div class="dots" id="dots"><span></span><span></span><span></span></div>
  </div>
  <pre id="debug" hidden></pre>
  <script src="receiver.js"></script>
</body>
</html>
